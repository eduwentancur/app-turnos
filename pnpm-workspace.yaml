packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 bloquea scripts de instalación por defecto: habilitamos solo los necesarios
onlyBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/engines"
  - prisma
  - sharp
  - unrs-resolver

# Scripts de instalación que no hacen falta (los binarios vienen incluidos en los paquetes)
ignoredBuiltDependencies:
  - esbuild
  - onnxruntime-node
  - protobufjs
